; WWE Crush Hour (PC native port) settings
[Display]
; Output resolution (window client size; Fullscreen=1 uses the monitor resolution, e.g. 3840x2160 on a 4K screen)
Width=1920
Height=1080
Fullscreen=0
VSync=1
; TargetFPS: 30 (original pacing), 60, or a high refresh rate (120, 144, 165, 240); 0 = the monitor's rate.
; With VSync=0 on a G-Sync / FreeSync display the picture follows the game's frame rate.
TargetFPS=60
; Widescreen=1: true 16:9 -- the 3D view is wider (more of the arena at the sides) and the HUD, text and menu
; panels keep their proportions (drawn in the middle 4:3 of the screen); movies and loading screens are shown
; 4:3 with side bars. Widescreen=0: the original 4:3 picture.
; KeepAspect=1 keeps the picture undistorted on screens of other shapes (bars at the sides or top/bottom).
KeepAspect=1
Widescreen=1
; FPS counter in the top-left corner (F1 toggles in game). FPS = frames shown, GAME = game frames.
ShowFPS=1
; InternalScale: the game is rendered at N x its PS2 resolution (1..6; 3 = 1920x1344, 6 = 3840x2688).
; 0 = automatic from the window / screen size: 1080p -> 3, 1440p -> 4, 4K -> 6. 1 = original PS2 sharpness.
InternalScale=0

[Timing]
; WallClockTimers=1: the PS2 hardware timers follow real time instead of how much game code ran. Experimental.
WallClockTimers=0

[Controls]
; Controllers: Xbox, PlayStation (DualShock 4 / DualSense), Switch Pro, Steam Deck and other pads, plugged in
; any time; buttons by position (bottom = Cross, right = Circle, left = Square, top = Triangle). The triggers are
; analog L2 / R2; the guide (Xbox / PS) button opens the mod menu.
; Deadzone: stick deadzone in percent (round, so diagonals stay intact).
Deadzone=15
; Keyboard for player 1: one or more keys per PS2 button, separated by commas (letters, digits, F1..F24, Up,
; Down, Left, Right, Space, Enter, Backspace, Tab, Shift, LShift, RShift, Ctrl, Alt, Insert, Delete, Home, End,
; PageUp, PageDown, Numpad0..3, Numpad5). The left stick is W / A / S / D. Empty = no key.
Up=Up
Down=Down
Left=Left
Right=Right
Cross=X, Space
Circle=C, Backspace
Square=Z
Triangle=V
L1=Q
R1=E
L2=1
R2=3
Start=Enter
Select=RShift, Tab
L3=
R3=

[Audio]
; Volumes in percent (0..100). Effects = sound effects, Commentary = the commentator, Movie = intro and
; entrance movies. Master scales everything. No audio device: the game runs silent and picks one up when
; it is plugged in.
MasterVolume=100
EffectsVolume=100
CommentaryVolume=100
MovieVolume=100
